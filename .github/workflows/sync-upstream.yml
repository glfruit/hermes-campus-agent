name: Sync official upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: sync-official-upstream
  cancel-in-progress: false

jobs:
  propose-sync:
    name: Propose upstream merge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout campus main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Stop when another sync PR is open
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open_count=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("automation/upstream-sync-"))] | length')
          if [ "$open_count" -gt 0 ]; then
            echo "An upstream sync PR is already open; leaving it for review."
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge official main into a proposal branch
        id: merge
        if: steps.guard.outputs.open == 'false'
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Campus main already contains official main."
            exit 0
          fi

          branch="automation/upstream-sync-${GITHUB_RUN_ID}"
          base_sha=$(git rev-parse HEAD)
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          git push origin "HEAD:refs/heads/$branch"

          if git diff --quiet "$base_sha"...HEAD -- optional-mcps/ hermes_cli/mcp_catalog.py; then
            mcp_catalog_changed=false
          else
            mcp_catalog_changed=true
          fi
          if git diff --quiet "$base_sha"...HEAD -- .github/workflows/ .github/actions/ .prettierrc ':(glob)**/eslint.config.*'; then
            ci_review_changed=false
          else
            ci_review_changed=true
          fi

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "mcp_catalog_changed=$mcp_catalog_changed" >> "$GITHUB_OUTPUT"
          echo "ci_review_changed=$ci_review_changed" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open review PR
        id: pr
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "merge: sync official Hermes main" \
            --body "Automated merge of NousResearch/hermes-agent main into the campus distribution branch. Review conflicts and CI before merging; production only consumes fork/main."
          gh pr view "$SYNC_BRANCH" --json number --jq '"number=\(.number)"' >> "$GITHUB_OUTPUT"

      - name: Run read-only validation on the proposal
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.merge.outputs.base_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MCP_CATALOG_CHANGED: ${{ steps.merge.outputs.mcp_catalog_changed }}
          CI_REVIEW_CHANGED: ${{ steps.merge.outputs.ci_review_changed }}
        run: |
          correlation="sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh workflow run upstream-validation.yml \
            -f proposal_sha="$(git rev-parse HEAD)" \
            -f base_sha="$BASE_SHA" \
            -f pr_number="$PR_NUMBER" \
            -f mcp_catalog_changed="$MCP_CATALOG_CHANGED" \
            -f correlation="$correlation"

          title="Validate upstream $correlation"
          for _ in $(seq 1 30); do
            run_id=$(gh run list --workflow upstream-validation.yml --event workflow_dispatch \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle == \"$title\") | .databaseId" \
              | head -1)
            [ -n "$run_id" ] && break
            sleep 2
          done
          [ -n "${run_id:-}" ] || { echo "Validation run was not created"; exit 1; }
          gh run watch "$run_id" --exit-status
          proposal_sha=$(git rev-parse HEAD)
          current_head=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          [ "$current_head" = "$proposal_sha" ] || {
            echo "PR head changed during validation; refusing stale success."
            exit 1
          }
          if [ "$CI_REVIEW_CHANGED" = true ] && ! gh pr view "$PR_NUMBER" \
            --json labels --jq '.labels[].name' | grep -Fxq ci-reviewed; then
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${proposal_sha}" \
              -f state=failure \
              -f context=trusted-pr-validation \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              -f description="CI-sensitive changes require ci-reviewed"
            echo "CI-sensitive changes are not reviewed; label the PR to trigger trusted validation."
            exit 1
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${proposal_sha}" \
            -f state=success \
            -f context=trusted-pr-validation \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            -f description="Trusted read-only upstream validation passed"
          gh pr edit "$PR_NUMBER" --add-label upstream-validated
          gh pr comment "$PR_NUMBER" --body "Trusted read-only upstream validation passed for commit \`${proposal_sha}\`: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
